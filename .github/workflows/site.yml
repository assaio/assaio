name: site

# The page at https://assaio.dev/ is a single static file, published by Cloudflare Workers
# Builds straight from this repository (docs/site.md). This workflow does not deploy it; what
# is left here are the guards on the two claims the page makes about itself.
#
# It used to guard a third: a version stamp in the footer, which had to equal the latest tag.
# That check existed because the page once ran three releases behind the binary. It is gone
# because the *stamp* is gone -- the page no longer names a version at all, so there is no
# longer a number on it that can silently fall behind. A fact worth stating once is worth
# stating in the one place it cannot rot, and for "which version is current" that place is the
# releases page, which the site now links instead of copying. What is left for a release to
# check by hand is in RELEASING.md, and none of it was ever mechanical.
#
# Deliberately not path-filtered. The guards have to run on every push and every tag, including
# the ones that do not touch site/ -- a release cut without updating the page is precisely the
# drift this exists to catch, and a path filter would skip it silently.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The page deliberately names no version, so it cannot advertise a stale one. This check is
  # what keeps that true: a number reintroduced here is a number somebody has to remember at
  # every tag, and the release that forgets it is the one nobody notices. Link the releases
  # page instead. (Version-shaped strings inside prose -- "v1.0 has to mean" -- are not stamps;
  # this looks for a bare vX.Y.Z, which is what a stamp is.)
  noversion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The site names no version
        run: |
          set -euo pipefail
          # grep exits 2 on a missing file and `if` reads that as "no match", so the guard would
          # pass on a page it never opened. Every check below assumes the file was read.
          test -f site/index.html || { echo "::error::site/index.html is missing"; exit 1; }
          # Two shapes are masked before the search, because neither is a version stamp and
          # both would otherwise read as one. Geometry attributes go first: optimized path data
          # writes implicit separators (`d="M12.5.5…"`, which SVGO emits by default), and a
          # dotted triple there is coordinates. Dotted quads go next: reference.html publishes
          # `serve --addr`'s default of 127.0.0.1:8787, and an IPv4 literal contains a
          # three-component prefix. Masking is the same move both times -- say what is not a
          # version, then look for one. sed keeps line count, so grep -n reports the real line.
          # A third masking, for the version of a tool that is not this one. The rule exists because
          # a stamp of *our* version has to be updated at every tag; another product's version does
          # not rot when we release, it rots when they do -- and naming it is the point, because
          # "verified against Antigravity CLI 1.1.23" is what makes a claim about a brittle,
          # self-updating format checkable. Only a version written beside the product it belongs to
          # is masked, so a bare number is still a finding, and so is ours.
          # The same distinction inside a link: a tag URL on another project's repository is a
          # citation, ours is a stamp. Our own URLs are set aside before foreign versioned ones are
          # masked and put back after, so a link to github.com/assaio/.../tag/vX.Y.Z still fails --
          # which is the case the error message below is written for.
          # Every text file under site/ is served, so every one of them can carry a stamp that
          # rots. The rule was written for the page and inherited by llms.txt the day it landed;
          # naming only index.html here would move the chore rather than remove it.
          fail=0
          while IFS= read -r page; do
            if sed -E 's/ (d|points|viewBox|transform)="[^"]*"//g; s/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/IPV4/g; s/(Antigravity CLI|Codex CLI|Claude Code|GitHub Copilot CLI|Copilot CLI|Gemini CLI|Cline|Cursor) v?[0-9]+\.[0-9]+\.[0-9]+/\1 THEIRVERSION/g; s#https://github\.com/assaio/#OURREPO/#g; s#https?://[^"[:space:]]*[0-9]+\.[0-9]+\.[0-9]+[^"[:space:]]*#THEIRURL#g; s#OURREPO/#https://github.com/assaio/#g' "$page" \
               | grep -nE '\bv?[0-9]+\.[0-9]+\.[0-9]+\b'; then
              echo "::error file=$page::This served file names a version. They deliberately do not:"
              echo "::error file=$page::a stamp here has to be updated at every tag, and the release that forgets is the one nobody catches."
              echo "::error file=$page::Link https://github.com/assaio/assaio/releases instead of copying the number."
              fail=1
            fi
          done < <(find site -type f \( -name '*.html' -o -name '*.txt' -o -name '*.md' \) | sort)
          exit $fail

  # The page's closing line promises it loads nothing -- no fonts, no analytics, no third-party
  # requests -- and that is a claim about the artifact, not a preference. It takes one pasted
  # embed to make it false, and a marketing badge is exactly the shape that arrives as one, so
  # the promise gets a check rather than a reviewer's memory. Inline the asset, or change the
  # sentence: both are fine, silently breaking it is not.
  #
  # Every served page is held to it, not just index.html: reference.html makes the same promise
  # in its own footer, and a rule that named one file would have to be remembered at the next.
  selfcontained:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The site fetches nothing at render time
        run: |
          set -euo pipefail
          test -f site/index.html || { echo "::error::site/index.html is missing"; exit 1; }
          fail=0
          while IFS= read -r page; do
            # Per page, so a failure on one does not annotate the next as broken -- pointing a
            # fixer at a generated file whose only edit path is internal/docs/style.go.
            page_fail=0
            # Every attribute a browser fetches without being asked, in each quoting form it
            # can take. Checking only src="..." would miss srcset=, a single-quoted src, and an
            # unquoted one -- three ways a pasted embed arrives.
            if grep -nEo '(src|srcset|poster|data)=("[^"]*"|'"'"'[^'"'"']*'"'"'|[^ >]+)' "$page" \
               | grep -vE '=["'"'"']?data:'; then
              echo "::error file=$page::A fetched attribute points somewhere other than a data: URI."
              page_fail=1
            fi
            # A <link> fetches on nearly every rel -- icon, manifest, preload, stylesheet.
            # Listing the ones that fetch means forgetting one, so this allows only the two
            # that do not.
            if grep -nE '<link[^>]*>' "$page" \
               | grep -vE 'rel="(canonical|alternate)"' | grep -v 'href="data:'; then
              echo "::error file=$page::A <link> fetches a subresource."
              page_fail=1
            fi
            if grep -nE '@import|url\(["'"'"']?(https?:)?//' "$page"; then
              echo "::error file=$page::A stylesheet rule pulls a remote resource."
              page_fail=1
            fi
            if [ "$page_fail" -ne 0 ]; then
              echo "::error file=$page::This page promises it loads nothing. Inline the asset, or change the promise."
              fail=1
            fi
          done < <(find site -type f -name '*.html' | sort)
          exit $fail

  # Workers Assets serves site/reference.html at /reference and 307s the extension away, so a
  # link or a canonical naming the file points at a redirect rather than at the page. That is
  # invisible in review and in a local browser, where opening the file works either way -- it
  # only shows up against the deployed site. This is the same failure mode as the version stamp:
  # a fact about the artifact that nothing checked. Every internal link and canonical has to name
  # a path the host actually serves.
  servedpaths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every internal link names a path the host serves
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r ref; do
            case "$ref" in
              /) continue ;;   # index.html, served at the root
              *.html) echo "::error::$ref names a file; Workers Assets serves it without the extension"; fail=1; continue ;;
            esac
            # Anything else must be an extensionless page or a real asset in the directory.
            if [ ! -f "site/${ref#/}.html" ] && [ ! -f "site/${ref#/}" ]; then
              echo "::error::$ref is linked but site/ serves no such page or asset"
              fail=1
            fi
          done < <(find site -type f -name '*.html' -exec grep -ohE '(href|content)="(https://assaio\.dev)?/[^"#]*"' {} + \
                   | sed -E 's/.*="(https:\/\/assaio\.dev)?([^"]*)"/\2/' | sort -u)
          exit $fail

  # A link to assaio.dev rendered as a bare grey line on LinkedIn and every other reader for as
  # long as the page shipped without an og:image -- the tags were all there except the one that
  # makes a card exist. It is not covered by `selfcontained`: a crawler fetches og:image out of
  # band, the page itself never does, so the "loads nothing" promise is untouched. What it needs
  # instead is proof the referenced file is actually served, because a card pointing at a 404 is
  # the same grey line with more markup.
  sharecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The page carries a share card, and the card exists
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r page; do
            for tag in 'og:image' 'og:image:width' 'og:image:height' 'og:image:alt' 'twitter:image'; do
              if ! grep -q "\"$tag\"" "$page"; then
                echo "::error file=$page::$tag is missing -- a shared link renders without a card."
                fail=1
              fi
            done
            # Every image the tags name has to be a file this repository actually serves.
            while read -r url; do
              path="site/${url#https://assaio.dev/}"
              if [ ! -f "$path" ]; then
                echo "::error file=$page::$url is referenced but $path is not in the repository."
                fail=1
              fi
            done < <(grep -oE 'content="https://assaio\.dev/[^"]+\.(png|jpg|jpeg|webp)"' "$page" \
                     | sed -E 's/content="([^"]*)"/\1/' | sort -u)
          done < <(find site -type f -name '*.html' | sort)
          exit $fail
