version: 2

project_name: assaio

# Builds from the module as the Go proxy serves it at the tag, not from the working tree, so
# the inputs are the ones anybody else can fetch. This is the half of reproducibility a
# checksum cannot show: a matching digest proves two builds agree, and only a fetched source
# tree proves they agreed about the same source. Requires the tag to be resolvable on
# proxy.golang.org, which it is the moment it is pushed to a public repository.
gomod:
  proxy: true

builds:
  - id: assaio-agent
    main: ./cmd/assaio-agent
    binary: assaio-agent
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # The two inputs that otherwise differ between builds of the same commit. -trimpath strips
    # the builder's absolute module and GOROOT paths, which are baked into the binary and
    # differ between a maintainer's laptop and a runner. mod_timestamp pins the archived file
    # mtimes to the commit's own time rather than the moment the build ran. ROADMAP condition 7
    # for v1.0 is a reproducible build; without these two, the same tag produces a different
    # checksum on every run and provenance attests only to who built it, not to what.
    flags:
      - -trimpath
    mod_timestamp: '{{ .CommitTimestamp }}'
    ldflags:
      - -s -w -X github.com/assaio/assaio/internal/version.Version={{.Version}}

archives:
  - id: assaio-agent-archive
    ids: [assaio-agent]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - NOTICE
      - README.md

checksum:
  name_template: checksums.txt

# An SPDX document per archive, attached to the release. The provenance attestation already
# says who built the artifact and from which commit; this says what is inside it, which is the
# question a downstream vulnerability advisory asks. Generated by syft, which the release
# workflow installs -- goreleaser shells out to it and fails the release if it is absent.
sboms:
  - artifacts: archive

changelog:
  use: git
  filters:
    exclude:
      - "^docs"
      - "^chore"
      - "^test"

release:
  header: |
    The curated story of this release lives in
    [CHANGELOG.md](https://github.com/assaio/assaio/blob/{{ .Tag }}/CHANGELOG.md);
    below is the raw commit list.

snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Homebrew formula pushed to the assaio/homebrew-tap repo on each release, so
# `brew install assaio/tap/assaio-agent` works on macOS and Linux. A formula (not a cask)
# is deliberate: it covers Linuxbrew too, where casks do not apply.
# PREREQUISITE (maintainer, before the first tagged release): create the public repo
# github.com/assaio/homebrew-tap and add a HOMEBREW_TAP_GITHUB_TOKEN secret (a PAT with
# contents:write on that tap repo) to this repo's Actions secrets -- the default
# GITHUB_TOKEN cannot push to another repository. Until both exist, comment this block out.
brews:
  - name: assaio-agent
    ids: [assaio-agent-archive]
    repository:
      owner: assaio
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/assaio/assaio"
    description: "Is your AI coding spend delivering? Offline, per-project analytics for Claude Code, Codex, Gemini CLI, and Cline."
    license: "Apache-2.0"
    install: |
      bin.install "assaio-agent"
    test: |
      system "#{bin}/assaio-agent", "--version"
